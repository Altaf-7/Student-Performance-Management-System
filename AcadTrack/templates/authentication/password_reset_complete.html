{% extends 'base.html' %}
{% load static %}
{% block title %}AcadTrack — Password Reset Complete{% endblock %}
{% block layout %}
<main class="auth-wrapper">
    <div class="auth-image">
        <img src="{% static 'auth_split_bg.jpg' %}" alt="Abstract Tech Background">
    </div>
    
    <div class="auth-form-container">
        <div class="auth-card glass-panel" style="text-align: center;">
            <div style="font-size: 52px; margin-bottom: 20px;">🎉</div>
            <div class="auth-header" style="margin-bottom: 25px;">
                <h2 class="gradient-text" style="font-weight: 700;">Password Updated!</h2>
                <p style="color: var(--muted); font-size: 15px; margin-top: 10px; line-height: 1.6;">
                    Your password has been changed successfully. You can now use your new credentials to log into your account.
                </p>
            </div>
            
            <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="display: block; width: 100%; text-decoration: none; font-size: 15px;">
                Proceed to Sign In
            </a>
        </div>
    </div>
</main>
{% endblock %}
