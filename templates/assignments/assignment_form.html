{% extends 'base.html' %}
{% block title %}New Assignment{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h4 class="mb-3">New Assignment &mdash; {{ offering.subject }}</h4>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
        <div class="mb-3"><label class="form-label">Instructions</label><textarea name="instructions" class="form-control" rows="3"></textarea></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">Maximum Marks</label><input type="number" min="1" name="max_marks" class="form-control" required></div>
          <div class="col-md-6 mb-3"><label class="form-label">Due Date</label><input type="datetime-local" name="due_date" class="form-control" required></div>
        </div>
        <div class="mb-3"><label class="form-label">Attachment (optional)</label><input type="file" name="attachment" class="form-control"></div>
        <button class="btn btn-primary" type="submit">Create Assignment</button>
        <a href="{% url 'academics:offering_detail' offering.pk %}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
