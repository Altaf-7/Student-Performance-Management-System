{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h4 class="mb-3">Change Password</h4>
<div class="card p-4" style="max-width:480px;">
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Current password</label>{{ form.old_password }}</div>
    <div class="mb-3"><label class="form-label">New password</label>{{ form.new_password1 }}</div>
    <div class="mb-3"><label class="form-label">Confirm new password</label>{{ form.new_password2 }}</div>
    {% for error in form.non_field_errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
