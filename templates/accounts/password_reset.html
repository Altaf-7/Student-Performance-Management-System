{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="auth-wrapper"><div class="card auth-card shadow-lg p-4">
  <h5 class="mb-3">Reset your password</h5>
  <p class="small text-muted">Enter your email and we'll send you reset instructions.</p>
  <form method="post">{% csrf_token %}
    <div class="mb-3">{{ form.email }}</div>
    <button type="submit" class="btn btn-primary w-100">Send reset link</button>
  </form>
  <div class="text-center mt-3"><a href="{% url 'accounts:login' %}" class="small">Back to login</a></div>
</div></div>
{% endblock %}
