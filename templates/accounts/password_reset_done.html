{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrapper"><div class="card auth-card shadow-lg p-4 text-center">
  <i class="bi bi-envelope-check" style="font-size:2rem;color:var(--spms-primary);"></i>
  <h5 class="mt-2">Check your inbox</h5>
  <p class="small text-muted">If an account exists with that email, a reset link has been sent.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to login</a>
</div></div>
{% endblock %}
