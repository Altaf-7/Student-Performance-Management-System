{% extends "base.html" %}
{% block auth_content %}
<div class="auth-wrapper"><div class="card auth-card shadow-lg p-4">
  {% if validlink %}
  <h5 class="mb-3">Set a new password</h5>
  <form method="post">{% csrf_token %}
    <div class="mb-3">{{ form.new_password1 }}</div>
    <div class="mb-3">{{ form.new_password2 }}</div>
    <button type="submit" class="btn btn-primary w-100">Reset password</button>
  </form>
  {% else %}
  <p>This reset link is invalid or has expired.</p>
  <a href="{% url 'accounts:password_reset' %}" class="btn btn-primary">Request a new link</a>
  {% endif %}
</div></div>
{% endblock %}
