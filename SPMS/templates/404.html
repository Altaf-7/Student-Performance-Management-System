{% extends 'base.html' %}
{% load static %}
{% block title %}404 — Page Not Found | SPMS{% endblock %}
{% block layout %}
<main style="min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="glass-panel" style="max-width: 520px; width: 100%; text-align: center; padding: 48px 32px; border-radius: 16px;">
        <div style="font-size: 72px; font-weight: 800; line-height: 1; margin-bottom: 12px; background: linear-gradient(135deg, #4f46e5, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            404
        </div>
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 12px; color: var(--text);">Page Not Found</h2>
        <p style="color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px;">
            The page you are looking for doesn't exist, has been moved, or you don't have permission to access it.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'landing_page' %}" class="btn btn-primary" style="padding: 12px 24px;">Return Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary" style="padding: 12px 24px;">Go Back</a>
        </div>
    </div>
</main>
{% endblock %}
