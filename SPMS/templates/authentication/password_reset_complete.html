{% extends 'base.html' %}
{% block title %}SPMS — Password Reset Complete{% endblock %}
{% block layout %}
<main class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <h2>Password Reset Complete</h2>
            <p>Your password has been set. You may go ahead and log in now.</p>
        </div>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="display: inline-block; margin-top: 15px;">Log in</a>
    </div>
</main>
{% endblock %}
