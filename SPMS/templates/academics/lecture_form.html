{% extends 'base.html' %}
{% block title %}Add Lecture{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4 class="mb-3">Add Lecture &mdash; {{ offering.subject }}</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Topic</label><input type="text" name="topic" class="form-control"></div>
        <button class="btn btn-primary" type="submit">Save & Mark Attendance</button>
        <a href="{% url 'academics:offering_detail' offering.pk %}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
