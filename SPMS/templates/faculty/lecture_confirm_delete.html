{% extends 'faculty/base.html' %}

{% block page_title %}Confirm Deletion{% endblock %}

{% block dashboard_content %}
<div class="dashboard-section form-container" style="max-width: 600px;">
    <h3 style="color: #d32f2f; margin-bottom: 15px;">Warning</h3>
    <p style="margin-bottom: 20px;">Are you sure you want to delete the lecture for <strong>{{ object.offering.subject.name }}</strong> on <strong>{{ object.date }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary" style="background: #d32f2f; border-color: #d32f2f;">Yes, Delete</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
